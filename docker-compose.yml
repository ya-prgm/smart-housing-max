version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: max_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_housing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_housing_secure_db_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_housing}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: max_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-smart_housing_secure_db_password_2026}@postgres:5432/${POSTGRES_DB:-smart_housing}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: max_frontend
    restart: always
    ports:
      - "${HTTP_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
    name: max_postgres_data
  uploads_data:
    name: max_uploads_data

networks:
  app_network:
    name: max_network
    driver: bridge