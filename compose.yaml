services:
  postgres:
    image: postgres:16-alpine
    container_name: max_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_home_database}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-44558833}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-my_home_database}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: max_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_home_database}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-44558833}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-44558833}@postgres:5432/${POSTGRES_DB:-my_home_database}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_API_URL: ${MAX_BOT_API_URL:-https://platform-api2.max.ru}
      MAX_BOT_NAME: ${MAX_BOT_NAME:-t739_hakaton_max_bot}
      SECRET_KEY: ${SECRET_KEY:-max_smart_housing_super_secret_jwt_key_2026_change_in_prod}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DOMAIN: ${DOMAIN:-obsuzhdalych.ru}
      APP_URL: ${APP_URL:-https://obsuzhdalych.ru}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: max_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
    name: max_postgres_data
  uploads_data:
    name: max_uploads_data

networks:
  app_network:
    name: max_network
    driver: bridge
