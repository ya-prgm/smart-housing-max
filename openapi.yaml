paths:
  /api/v1/auth/max-login:
    post:
      tags:
      - Auth
      summary: Login Max
      operationId: login_max_api_v1_auth_max_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: INVALID_INIT_DATA или INIT_DATA_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/esia-login:
    post:
      tags:
      - Auth
      summary: Login ESIA (MOCK)
      description: Имитация входа через ЕСИА (Госуслуги). Реальная интеграция требует
        аккредитации в Минцифры и подключения к СМЭВ ЕСИА. Для демонстрации используются
        тестовые учётные записи.
      operationId: login_esia_api_v1_auth_esia_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsiaLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
