components:
  schemas:
    ActivityType:
      type: string
      enum:
      - ticket_created
      - ticket_status
      - post_published
      - poll_started
      - role_assigned
      title: ActivityType
    AuthTokens:
      properties:
        accessToken:
          type: string
          title: Accesstoken
        refreshToken:
          type: string
          title: Refreshtoken
      type: object
      required:
      - accessToken
      - refreshToken
      title: AuthTokens
    AuthUser:
      properties:
        id:
          type: integer
          title: Id
        max_user_id:
          type: integer
          title: Max User Id
        full_name:
          type: string
          title: Full Name
        role:
          $ref: '#/components/schemas/UserRole'
        house_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: House Id
        house_address:
          anyOf:
          - type: string
          - type: 'null'
          title: House Address
        apartment_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Apartment Number
      type: object
      required:
      - id
      - max_user_id
      - full_name
      - role
      title: AuthUser
    Body_upload_file_api_v1_files_upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
        context:
          $ref: '#/components/schemas/FileContext'
          default: ticket
      type: object
      required:
      - file
      title: Body_upload_file_api_v1_files_upload_post
    CommentCreate:
      properties:
        content:
          type: string
          title: Content
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - content
      title: CommentCreate
    CommentResponse:
      properties:
        id:
          type: integer
          title: Id
        author_name:
          type: string
          title: Author Name
        author_role:
          $ref: '#/components/schemas/UserRole'
        author_avatar:
          anyOf:
          - type: string
          - type: 'null'
          title: Author Avatar
        content:
          type: string
          title: Content
        created_at:
          type: string
          format: date-time
          title: Created At
        replies:
          items:
            $ref: '#/components/schemas/CommentResponse'
          type: array
          title: Replies
          default: []
      type: object
      required:
      - id
      - author_name
      - author_role
      - content
      - created_at
      title: CommentResponse
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorResponse
    EsiaLoginRequest:
      properties:
        identifier:
